name: CD
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: debug ref
        run: |
          echo "ref       = ${{ github.ref }}"
          echo "ref_type  = ${{ github.ref_type }}"
          echo "ref_name  = ${{ github.ref_name }}"
          echo "event     = ${{ github.event_name }}"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vivolkova/finance-tracker
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure minikube is running
        run: |
          $ErrorActionPreference = 'Continue'
          $hostState = minikube status --format '{{.Host}}'
          $apiState  = minikube status --format '{{.APIServer}}'
          if ($LASTEXITCODE -ne 0 -or $hostState -ne 'Running' -or $apiState -ne 'Running') {
            Write-Host "minikube is not ready (host: '$hostState', apiserver: '$apiState') - starting it"
            minikube start
            if ($LASTEXITCODE -ne 0) { throw "minikube start failed" }
          } else {
            Write-Host "minikube is already running"
          }

      - name: Verify cluster is reachable
        run: |
          $ErrorActionPreference = 'Continue'
          kubectl --context minikube cluster-info
          if ($LASTEXITCODE -ne 0) { throw "cluster is not reachable - check kubeconfig of the runner account" }

      - name: Set image tag
        run: |
          (Get-Content k8s/kustomization.yaml) -replace 'newTag:.*', 'newTag: sha-${{ github.sha }}' | Set-Content k8s/kustomization.yaml
          Get-Content k8s/kustomization.yaml | Select-String 'newTag'

      - name: Apply manifests
        run: kubectl --context minikube apply -k k8s/

      - name: Wait for rollout
        run: kubectl --context minikube rollout status deployment/finance-tracker -n finance-tracker --timeout=120s